name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      # Official installer commands: https://www.moonbitlang.com/download/
      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" update

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:USERPROFILE\.moon\bin\moon.exe" update

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Toolchain version
        shell: bash
        run: moon version --all

      - name: Format check
        shell: bash
        run: moon fmt --check

      - name: Type check
        shell: bash
        run: |
          moon check --deny-warn --target native
          moon check --deny-warn --target wasm-gc
          moon check --deny-warn --target js

      - name: Build
        shell: bash
        run: moon build --target native

      - name: Test (native)
        shell: bash
        run: moon test --target native

      - name: Test (wasm-gc)
        shell: bash
        run: moon test --target wasm-gc

      - name: Test (js)
        shell: bash
        run: moon test --target js

      - name: Test (wasm)
        shell: bash
        run: moon test --target wasm

      - name: README version
        run: python3 scripts/check-readme-version.py

      - name: CLI integration
        shell: bash
        run: python scripts/test-cli.py

      - name: Interface drift
        shell: bash
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: README quick starts
        shell: bash
        run: |
          moon run examples/api-demo
          moon run cmd/main -- feel 'sum([1, 2, 3]) * 2'
          moon run cmd/main -- lint examples/eligibility.dmn
          moon run cmd/main -- eval examples/eligibility.dmn --decision Eligible --input examples/input.json

  playground:
    name: Playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Official installer commands: https://www.moonbitlang.com/download/
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" update

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build playground
        run: scripts/build-web.sh

      - name: Smoke test
        run: |
          node --test web/*-contract.test.mjs
          node web/smoke.mjs

  tck:
    name: DMN TCK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Official installer commands: https://www.moonbitlang.com/download/
      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" update

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:USERPROFILE\.moon\bin\moon.exe" update

      - name: Fetch pinned TCK
        run: ./scripts/fetch-tck.sh

      - name: Level 2 conformance
        run: |
          moon run cmd/main --target native -- tck .tck/TestCases/compliance-level-2 \
            --now 2026-01-01T00:00:00Z --json "${{ runner.temp }}/tck-level-2.json"

      - name: Level 3 conformance
        run: |
          moon run cmd/main --target native -- tck .tck/TestCases/compliance-level-3 \
            --now 2026-01-01T00:00:00Z --json "${{ runner.temp }}/tck-level-3.json"

      - name: Summarise
        run: |
          python3 scripts/test-conformance-report.py
          python3 scripts/audit/test-tck-gate.py
          for level in 2 3; do
            if [ "$level" = 2 ]; then total=116; minimum=116; else total=3291; minimum=3271; fi
            python3 scripts/audit/moondmn-r4-tck.py --total "$total" --minimum "$minimum" \
              "${{ runner.temp }}/tck-level-$level.json" "evidence/tck-level-$level.json"
          done

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: tck-reports
          path: ${{ runner.temp }}/tck-level-*.json
