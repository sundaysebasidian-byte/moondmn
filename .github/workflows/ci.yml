name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      # Official installer commands: https://www.moonbitlang.com/download/
      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" update

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:USERPROFILE\.moon\bin\moon.exe" update

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Toolchain version
        shell: bash
        run: moon version --all

      - name: Format check
        shell: bash
        run: moon fmt --check

      - name: Type check
        shell: bash
        run: |
          moon check --deny-warn --target native
          moon check --deny-warn --target wasm-gc
          moon check --deny-warn --target js

      - name: Build
        shell: bash
        run: moon build --target native

      - name: Test (native)
        shell: bash
        run: moon test --target native

      - name: Test (wasm-gc)
        shell: bash
        run: moon test --target wasm-gc

      - name: Test (js)
        shell: bash
        run: moon test --target js

      - name: CLI integration
        shell: bash
        run: python scripts/test-cli.py

      - name: Interface drift
        shell: bash
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: README quick starts
        shell: bash
        run: |
          moon run examples/api-demo
          moon run cmd/main -- feel 'sum([1, 2, 3]) * 2'
          moon run cmd/main -- lint examples/eligibility.dmn
          moon run cmd/main -- eval examples/eligibility.dmn --decision Eligible --input examples/input.json

  playground:
    name: Playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Official installer commands: https://www.moonbitlang.com/download/
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" update

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build playground
        run: scripts/build-web.sh

      - name: Smoke test
        run: node web/smoke.mjs

  tck:
    name: DMN TCK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Official installer commands: https://www.moonbitlang.com/download/
      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" update

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:USERPROFILE\.moon\bin\moon.exe" update

      - name: Fetch pinned TCK
        run: ./scripts/fetch-tck.sh

      - name: Level 2 conformance
        run: |
          moon run cmd/main -- tck .tck/TestCases/compliance-level-2 \
            --json evidence/tck-level-2.json

      - name: Level 3 conformance
        run: |
          moon run cmd/main -- tck .tck/TestCases/compliance-level-3 \
            --json evidence/tck-level-3.json

      - name: Summarise
        run: |
          python3 - <<'EOF'
          import json
          for level in (2, 3):
              with open(f"evidence/tck-level-{level}.json") as handle:
                  report = json.load(handle)
              print(f"Level {level}: {report['passed']}/{report['total']} passed")
              assert report['skipped'] == 0 and report['total'] > 0
              minimum = 1.0 if level == 2 else 0.96
              assert report['passed'] / report['total'] >= minimum
          EOF

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: tck-reports
          path: evidence/*.json
