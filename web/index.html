<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoonDMN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M21 4a12 12 0 1 0 7 21A10 10 0 0 1 21 4z' fill='%234a5fd8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    var saved = localStorage.getItem("theme");
    if (saved) document.documentElement.dataset.theme = saved;
  })();
</script>
</head>
<body>
<header class="top">
  <div class="brand">MoonDMN</div>
  <nav class="seg" id="modes" aria-label="Mode">
    <button type="button" data-mode="decision">Decision</button>
    <button type="button" data-mode="feel">FEEL</button>
  </nav>
  <nav class="seg" id="examples" aria-label="Examples"></nav>
  <div class="spacer"></div>
  <input class="clock" id="now" type="datetime-local" step="1" aria-label="Now" title="Now">
  <button class="icon-btn" id="theme" type="button" aria-label="Theme">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
  </button>
</header>

<main class="layout" id="view-decision">
  <section class="column">
    <div class="card fill" id="model-card">
      <div class="card-head">
        <h2>Model</h2>
        <button class="icon-btn small" id="open" type="button" aria-label="Open file" title="Open file">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 14v5h14v-5"/></svg>
        </button>
        <input type="file" id="file" accept=".dmn,.xml,text/xml,application/xml" hidden>
      </div>
      <div class="editor" id="model-editor"></div>
      <ul class="issues" id="issues" hidden></ul>
    </div>
  </section>

  <section class="column">
    <div class="card fill">
      <div class="card-head">
        <h2>Input</h2>
        <select id="decision" aria-label="Decision"></select>
      </div>
      <form class="fields" id="form" autocomplete="off" onsubmit="return false"></form>
    </div>
  </section>

  <section class="column">
    <div class="card grow-2">
      <div class="card-head">
        <h2>Result</h2>
        <span class="chip" id="result-type" hidden></span>
      </div>
      <div class="result-body" id="result"></div>
      <div class="graph" id="graph"></div>
    </div>
    <div class="card grow-3">
      <div class="card-head"><h2>Tables</h2></div>
      <div class="tables" id="tables"></div>
    </div>
  </section>
</main>

<main class="feel" id="view-feel" hidden>
  <div class="card feel-card">
    <label class="expr">
      <input id="feel-expression" spellcheck="false" autocomplete="off">
    </label>
    <label class="ctx">Context
      <textarea id="feel-context" spellcheck="false" rows="4"></textarea>
    </label>
    <div class="feel-result" id="feel-result"></div>
  </div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
